# This repository is generated from Vele189/ClearSkies, and the authoritative
# suite runs there. What this one proves is that the service still stands on its
# own: that the split left a repository which installs, builds, and produces an
# image that serves the app.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Already covered by `npm run test`, and run again on its own so that an
      # accessibility regression fails a step that says so.
      - name: Accessibility (axe)
        run: npm run test:a11y
      - run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clearskies-web:ci .
      # The bundle is baked in at build time, so what this checks is that nginx
      # is configured and serving. The second request is a client-side route:
      # without the try_files fallback it is a 404, and a 404 on a deep link is
      # the failure that configuration exists to prevent.
      - name: The image serves the app and its routes
        run: |
          docker run -d --name web-ci -p 8080:8080 clearskies-web:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS http://localhost:8080/hex/8844c0b18bfffff | grep -q 'id="root"'
          docker rm -f web-ci
